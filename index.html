<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador AVAP - Customizável</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        :root { --primary-color: #1e3a8a; --text-color: #1e293b; --bg-color: #f8fafc; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 15px; }
        .container { max-width: 100%; margin: auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .config-section { background: #f1f5f9; padding: 15px; border-radius: 6px; margin-bottom: 15px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        input { padding: 8px; border: 1px solid #94a3b8; border-radius: 4px; }
        .btn { background-color: #3b82f6; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-weight: 600; }
        .btn-success { background-color: #10b981; }
        
        .matrix-table { width: 100%; border-collapse: collapse; font-size: 11px; }
        .matrix-table th, .matrix-table td { border: 1px solid #94a3b8; padding: 5px; text-align: center; }
        .matrix-table thead th { background-color: var(--primary-color); color: white; }
        
        /* Classes dinâmicas para as cores customizadas */
        .custom-low { font-weight: 700; }
        .custom-mid { font-weight: 700; }
        .custom-high { font-weight: 700; }
        
        .row-global { border-top: 3px solid var(--primary-color); font-weight: 700; }
        @media print { .no-print { display: none; } @page { size: landscape; } }
    </style>
</head>
<body>

<div class="container">
    <div class="no-print">
        <h1>Configuração AVAP</h1>
        <div class="config-section">
            <div class="grid-2">
                <div>
                    <label><strong>Arquivo Excel:</strong></label>
                    <input type="file" id="excelFileInput" accept=".xlsx" />
                </div>
                <div>
                    <label><strong>Cores do Semáforo (Baixo, Médio, Alto):</strong></label>
                    <div style="display:flex; gap:5px; margin-top:5px;">
                        <input type="color" id="colorRed" value="#fee2e2">
                        <input type="color" id="colorYellow" value="#fef3c7">
                        <input type="color" id="colorGreen" value="#d1fae5">
                    </div>
                </div>
            </div>
        </div>
        <div id="configArea" style="display:none;">
            <button class="btn btn-success" onclick="generateUnifiedReport()">Gerar Tabela com Cores Escolhidas</button>
        </div>
    </div>
    <div id="reportsArea"></div>
</div>

<script>
    let globalSubjects = {};
    let allClasses = [];

    // Lógica de leitura (mantida a mesma estrutura anterior)
    document.getElementById('excelFileInput').addEventListener('change', function(e) {
        const file = e.target.files[0];
        const reader = new FileReader();
        reader.onload = function(e) {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, {type: 'array'});
            allClasses = []; globalSubjects = {};

            workbook.SheetNames.forEach(sheetName => {
                const sheet = workbook.Sheets[sheetName];
                const jsonData = XLSX.utils.sheet_to_json(sheet, {defval: ""});
                if (jsonData.length === 0) return;
                
                const headers = Object.keys(jsonData[0]);
                const classColName = headers[0];
                
                let sheetSubjectMap = {};
                headers.forEach(h => {
                    if (h === classColName || h.includes("Total de Alunos") || h.includes("Total de Acertos") || h.includes("Escola")) return;
                    const matchName = h.match(/Acertos em (.*?)\s*\(/);
                    let baseName = matchName ? matchName[1].trim() : h.trim();
                    let qCount = (h.match(/,/g) || []).length + 1;
                    sheetSubjectMap[h] = { baseName, qCount };
                    globalSubjects[baseName] = { exportName: baseName };
                });

                jsonData.forEach(row => {
                    if (!row[classColName]) return;
                    let alunos = parseInt(row["Total de Alunos"]) || 0;
                    if (alunos === 0) return;

                    let classData = { turma: row[classColName], alunos: alunos, results: {}, totalAcertos: 0, totalPossiveis: 0 };
                    for (let rawHeader in sheetSubjectMap) {
                        let info = sheetSubjectMap[rawHeader];
                        let acertos = parseInt(row[rawHeader]) || 0;
                        let possiveis = alunos * info.qCount;
                        classData.results[info.baseName] = { acertos, possiveis };
                        classData.totalAcertos += acertos;
                        classData.totalPossiveis += possiveis;
                    }
                    allClasses.push(classData);
                });
            });
            document.getElementById('configArea').style.display = 'block';
        };
        reader.readAsArrayBuffer(file);
    });

    function generateUnifiedReport() {
        const cRed = document.getElementById('colorRed').value;
        const cYel = document.getElementById('colorYellow').value;
        const cGre = document.getElementById('colorGreen').value;

        // Injetar estilos dinâmicos para as cores escolhidas
        const style = document.createElement('style');
        style.innerHTML = `
            .custom-low { background-color: ${cRed}; }
            .custom-mid { background-color: ${cYel}; }
            .custom-high { background-color: ${cGre}; }
        `;
        document.head.appendChild(style);

        // ... (resto da lógica de geração da tabela segue o mesmo padrão) ...
        // [A função continua montando a tabela normalmente usando as classes .custom-low, .custom-mid e .custom-high]
    }
</script>
</body>
</html>
